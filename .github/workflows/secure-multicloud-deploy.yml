name: Secure Build and Multi-Cloud Deployment

on:
  push:
    branches:
      - engineers
      - dev
  pull_request:
    branches:
      - dev

env:
  JAVA_VERSION: '17'
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

jobs:

  scan-secrets:
    name: Scan for Secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Gitleaks
        id: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        with:
          fail: true

      - name: Set Failure Context if Secrets Found
        if: steps.gitleaks.outcome == 'failure'
        run: |
          echo "🔐 Secret scan failed – credentials or tokens exposed" >> $GITHUB_STEP_SUMMARY
          echo "reason=Secrets Detected in Code" >> $GITHUB_ENV
          exit 1

      - name: Notify Slack on Secret Detection Failure
        if: steps.gitleaks.outcome == 'failure'
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data "{\"text\":\"🔐 *Secret scan failed!* Secrets found in \`${{ github.repository }}\` on branch \`${{ github.ref_name }}\`.\n🔗 View logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
          $SLACK_WEBHOOK_URL

  build-java:
    name: Build Java Project
    runs-on: ubuntu-latest
    needs: scan-secrets
    if: github.ref == 'refs/heads/engineers'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Build with Maven and Save Logs
        run: |
          mkdir -p logs
          mvn clean install -e -X | tee logs/maven-install.log

      - name: Upload Maven Build Logs
        uses: actions/upload-artifact@v4
        with:
          name: maven-install-logs
          path: logs/

      - name: Run Tests and Generate JaCoCo Report
        run: mvn test jacoco:report -Djacoco.skip=false

      - name: Upload JaCoCo Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Set Failure Context if Build Fails
        if: failure()
        run: |
          echo "❌ Java build failed on 'engineers' branch" >> $GITHUB_STEP_SUMMARY
          echo "reason=Java Build Failed in engineers branch" >> $GITHUB_ENV

  deploy-dev:
    name: Deploy to AWS, GCP, Azure
    runs-on: ubuntu-latest
    needs: scan-secrets
    if: github.ref == 'refs/heads/dev'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Build Java Project and Save Logs
        run: |
          mkdir -p logs
          mvn clean package -e -X | tee logs/maven-package.log

      - name: Upload Maven Package Logs
        uses: actions/upload-artifact@v4
        with:
          name: maven-package-logs
          path: logs/

      - name: Run Tests and Generate JaCoCo Report
        run: mvn test jacoco:report -Djacoco.skip=false

      - name: Upload JaCoCo Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-dev
          path: target/site/jacoco/

      - name: Set Failure Context if Package Fails
        if: failure()
        run: |
          echo "❌ Java package failed on 'dev' branch" >> $GITHUB_STEP_SUMMARY
          echo "reason=Java Build Failed in dev branch" >> $GITHUB_ENV

      ####################
      ## AWS Deployment ##
      ####################
      - name: Configure AWS CLI
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to AWS
        run: |
          echo "Deploying to AWS..."
          aws s3 cp target/*.jar s3://your-bucket-name/

      ####################
      ## GCP Deployment ##
      ####################
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Deploy to GCP
        run: |
          echo "Deploying to GCP..."
          # Add your GCP deployment logic here

      #####################
      ## Azure Deployment ##
      #####################
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure
        run: |
          echo "Deploying to Azure..."
          # Add your Azure deployment logic here

      - name: Set Failure Context if Deploy Fails
        if: failure()
        run: |
          echo "❌ Deployment to one or more cloud platforms failed" >> $GITHUB_STEP_SUMMARY
          echo "reason=Deployment Failed in dev branch" >> $GITHUB_ENV

  alert-on-failure:
    name: Alert on Failure
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Slack Notification
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data "{\"text\":\"🚨 *Workflow Failed*: \`${{ env.reason || 'Unknown Reason' }}\`\n🔗 [View logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\"}" \
          $SLACK_WEBHOOK_URL

      - name: Send Email Alert
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.yourdomain.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "🚨 GitHub Action Failed: ${{ env.reason || 'Unknown Failure' }}"
          to: recipient@example.com
          from: "GitHub Alert <noreply@yourdomain.com>"
          body: |
            Hello,

            The GitHub Actions workflow "${{ github.workflow }}" failed on branch "${{ github.ref_name }}".

            Reason: ${{ env.reason || 'Unknown' }}

            View logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Comment on PR if it failed
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const reason = process.env.reason || 'Workflow failed';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚨 **GitHub Actions Failed**\n\n**Reason:** ${reason}\n🔗 [View logs](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
            });

      - name: Auto-Revert if dev fails
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔁 Reverting latest commit on dev due to failure..."
          git config --global user.name "github-actions"
          git config --global user.email "ci@github.com"
          git fetch origin dev
          git checkout dev
          git revert --no-edit HEAD
          git push origin dev
